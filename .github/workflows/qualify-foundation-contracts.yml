name: qualify-foundation-contracts

on:
  push:
    branches:
      - one/attune-foundation-contracts-v1
  pull_request:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact workflow subject
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Contract tests
        run: PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Compile
        run: python -m compileall -q src tests
